<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:F;src:url(/fraunces-latin-600-normal.woff2) format('woff2')}
html,body{margin:0}
#c{position:relative;width:1280px;height:720px;overflow:hidden;background:#f3ede4;font-family:Inter,system-ui,sans-serif;color:#26342a}
h1{position:absolute;left:56px;top:56px;margin:0;font-family:F;font-weight:600;font-size:92px;line-height:1;letter-spacing:-2px;width:700px}
.r{color:#a8553a}
.bar{position:absolute;left:60px;width:600px}
.lab{display:flex;justify-content:space-between;font-weight:900;font-size:30px;margin-bottom:10px}
.tr{height:46px;border-radius:23px;background:#e6d9c3;overflow:hidden}
.fi{height:100%;border-radius:23px}
.card{position:absolute;right:50px;top:50px;width:470px;height:400px;border-radius:40px;overflow:hidden;border:9px solid #a8553a;box-shadow:0 20px 50px rgba(38,52,42,.25);background:#fbf6ee}
.card img{position:absolute;left:-150px;top:-70px;width:700px;transform:rotate(-9deg)}
.x{position:absolute;right:30px;top:24px;background:#a8553a;color:#fff;font-weight:900;font-size:30px;padding:10px 22px;border-radius:999px}
.ok{position:absolute;right:50px;top:475px;width:470px;height:130px;border-radius:36px;background:#2f4a36;color:#fffaf2;display:flex;align-items:center;justify-content:center;gap:18px;font-weight:900;font-size:40px;box-shadow:0 20px 50px rgba(38,52,42,.25)}
.ck{width:70px;height:70px;border-radius:35px;background:#d8a24a;display:grid;place-items:center;font-size:42px;color:#26342a}
.foot{position:absolute;left:60px;top:600px;width:600px;font-weight:800;font-size:28px;color:#7a5a3f;letter-spacing:1px}
</style></head><body><div id="c">
<h1>Seit Jahren<br><span class="r">KEIN</span><br>Fortschritt?</h1>
<div class="bar" style="top:390px"><div class="lab"><span>Dein Reiten</span><span class="r">23 %</span></div><div class="tr"><div class="fi" style="width:23%;background:#a8553a"></div></div></div>
<div class="bar" style="top:495px"><div class="lab"><span>mit der Reitakademie</span><span style="color:#2f4a36">100 % ✓</span></div><div class="tr"><div class="fi" style="width:100%;background:#2f4a36"></div></div></div>
<div class="card"><img src="/thumb_fig.png"><div class="x">✗ wackelig</div></div>
<div class="ok"><span class="ck">✓</span>So geht's besser</div>
<div class="foot">DIE HOFGESCHICHTEN</div>
</div></body></html>
