<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:F;src:url(/fraunces-latin-600-normal.woff2) format('woff2')}
html,body{margin:0;background:transparent}
#c{position:relative;width:1920px;height:1080px;font-family:Inter,system-ui,sans-serif;color:#26342a}
.side{position:absolute;top:0;bottom:0;background:#f3ede4}
#L{left:0;width:656px} #R{right:0;width:656px}
.hole{position:absolute;left:656px;width:608px;top:0;bottom:0;box-shadow:0 0 0 0 transparent}
.eb{letter-spacing:4px;font-weight:800;font-size:22px;color:#7a5a3f}
h1{font-family:F;font-weight:600;font-size:64px;line-height:1.02;margin:14px 0 0}
.it{display:flex;align-items:center;gap:22px;margin:0 0 26px;font-weight:800;font-size:36px;padding:16px 26px;border-radius:999px;background:#fffaf2;opacity:.45}
.it.on{opacity:1;background:#2f4a36;color:#fffaf2;transform:scale(1.06);transform-origin:left}
.it.done{opacity:1}
.ck{width:46px;height:46px;border-radius:23px;background:#d8a24a;color:#fff;display:grid;place-items:center;font-size:26px;flex:none}
.hz img{width:120px;height:120px;border-radius:60px;object-fit:cover;border:5px solid #fffaf2;box-shadow:0 10px 24px rgba(38,52,42,.18);margin-right:14px}
.pill{display:inline-block;white-space:nowrap;padding:18px 34px;border-radius:999px;font-weight:800;font-size:34px}
</style></head><body><div id="c"></div><script>
const S=+new URLSearchParams(location.search).get('s');
const items=['Reitakademie','Reitertagebuch','Rider Lab ✨'];
const left = S===0
 ? `<div class="eb">DIE HOFGESCHICHTEN</div><h1>Seit Jahren<br><span style="color:#a8553a">kein Fortschritt</span><br>im Sattel?</h1>`
 : `<div class="eb">DIE HOFGESCHICHTEN</div><h1 style="margin-bottom:44px">Alles in<br>einer App</h1>`+items.map((t,i)=>{const n=i+1;const c=S===4?'done':S===n?'on':S>n?'done':'';return `<div class="it ${c}"><span class="ck">${(S>n||S===4)?'✓':n}</span>${t}</div>`}).join('');
document.getElementById('c').innerHTML=`
<div class="side" id="L"><div style="position:absolute;left:90px;right:50px;top:${S===0?330:250}px">${left}</div></div>
<div class="side" id="R"><div style="position:absolute;left:70px;right:70px;top:300px">
 <div class="hz" style="margin-bottom:40px"><img src="/horses/tivoli-480.webp"><img src="/horses/tonga-480.webp"><img src="/horses/scrabble-480.webp"></div>
 <div style="font-family:F;font-size:40px;line-height:1.15;margin-bottom:36px">Tivoli, Tonga &amp; Scrabble<br>freuen sich auf dich</div>
 <div class="pill" style="background:${S===4?'#d8a24a':'#2f4a36'};color:${S===4?'#26342a':'#fffaf2'};font-size:30px">Link in der Beschreibung ↓</div>
 <div style="margin-top:22px;font-weight:700;font-size:28px;color:#7a5a3f">Einmal kaufen · kein Abo</div>
</div></div>`;
</script></body></html>
